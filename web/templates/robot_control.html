<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚜 Керування Роботом</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .status-indicator {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-top: 10px;
        }
        
        .status-disconnected {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
        }
        
        .status-connected {
            background: rgba(74, 222, 128, 0.2);
            border: 1px solid #4ade80;
            color: #86efac;
        }
        
        .control-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .joystick-container {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .joystick {
            width: 200px;
            height: 200px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            position: relative;
            border: 3px solid rgba(74, 222, 128, 0.3);
            box-shadow: 0 0 30px rgba(74, 222, 128, 0.2);
        }
        
        .joystick-stick {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: grab;
            box-shadow: 0 5px 20px rgba(74, 222, 128, 0.5);
            transition: box-shadow 0.2s;
        }
        
        .joystick-stick:active {
            cursor: grabbing;
            box-shadow: 0 2px 10px rgba(74, 222, 128, 0.8);
        }
        
        .joystick-label {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .btn {
            background: rgba(74, 222, 128, 0.2);
            border: 2px solid #4ade80;
            color: #4ade80;
            padding: 15px 25px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
            text-align: center;
        }
        
        .btn:hover {
            background: rgba(74, 222, 128, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74, 222, 128, 0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
            color: #fca5a5;
        }
        
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.3);
        }
        
        .btn-primary {
            background: rgba(59, 130, 246, 0.2);
            border-color: #3b82f6;
            color: #93c5fd;
        }
        
        .btn-primary:hover {
            background: rgba(59, 130, 246, 0.3);
        }
        
        .info-panel {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .info-row:last-child {
            border-bottom: none;
        }
        
        .info-label {
            color: #94a3b8;
        }
        
        .info-value {
            color: #4ade80;
            font-weight: 600;
        }
        
        @media (max-width: 600px) {
            .joystick {
                width: 150px;
                height: 150px;
            }
            
            .joystick-stick {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚜 Керування Роботом</h1>
            <div class="status-indicator" id="status-indicator">
                <span id="status-text">🔴 Не підключено</span>
            </div>
        </div>
        
        <div class="control-panel">
            <!-- Джойстики -->
            <div class="joystick-container">
                <!-- Джойстик руху -->
                <div>
                    <div class="joystick" id="movement-joystick">
                        <div class="joystick-stick" id="movement-stick"></div>
                    </div>
                    <div class="joystick-label">
                        Рух: <span id="speed-value">0</span> | <span id="turn-value">0</span>
                    </div>
                </div>
                
                <!-- Джойстик повороту (опціонально) -->
                <div>
                    <div class="joystick" id="rotation-joystick">
                        <div class="joystick-stick" id="rotation-stick"></div>
                    </div>
                    <div class="joystick-label">
                        Прополювач: <span id="servo-value">90</span>°
                    </div>
                </div>
            </div>
            
            <!-- Кнопки керування -->
            <div class="controls-grid">
                <button class="btn btn-primary" onclick="connectRobot()">
                    🔌 Підключити
                </button>
                <button class="btn btn-danger" onclick="stopRobot()">
                    ⏹️ СТОП
                </button>
                <button class="btn" onclick="weedPulse()">
                    🌾 Прополоти
                </button>
                <button class="btn btn-primary" onclick="goToDetection()">
                    🎯 До Детекції
                </button>
            </div>
            
            <!-- Інформаційна панель -->
            <div class="info-panel">
                <div class="info-row">
                    <span class="info-label">Швидкість:</span>
                    <span class="info-value" id="info-speed">0</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Поворот:</span>
                    <span class="info-value" id="info-turn">0</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Сервопривод:</span>
                    <span class="info-value" id="info-servo">90°</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Статус:</span>
                    <span class="info-value" id="info-status">Очікування</span>
                </div>
            </div>
        </div>
        
        <div style="text-align: center; margin-top: 20px;">
            <a href="/" style="color: #4ade80; text-decoration: none;">
                ← Назад до детекції
            </a>
        </div>
    </div>
    
    <script>
        // === JOYSTICK LOGIC ===
        class Joystick {
            constructor(containerId, stickId, onChange) {
                this.container = document.getElementById(containerId);
                this.stick = document.getElementById(stickId);
                this.onChange = onChange;
                
                this.isDragging = false;
                this.centerX = 0;
                this.centerY = 0;
                this.maxDistance = 60; // px
                
                this.setupEvents();
                this.resetPosition();
            }
            
            setupEvents() {
                // Mouse events
                this.stick.addEventListener('mousedown', this.startDrag.bind(this));
                document.addEventListener('mousemove', this.drag.bind(this));
                document.addEventListener('mouseup', this.stopDrag.bind(this));
                
                // Touch events
                this.stick.addEventListener('touchstart', this.startDrag.bind(this));
                document.addEventListener('touchmove', this.drag.bind(this));
                document.addEventListener('touchend', this.stopDrag.bind(this));
            }
            
            startDrag(e) {
                e.preventDefault();
                this.isDragging = true;
                
                const rect = this.container.getBoundingClientRect();
                this.centerX = rect.left + rect.width / 2;
                this.centerY = rect.top + rect.height / 2;
            }
            
            drag(e) {
                if (!this.isDragging) return;
                e.preventDefault();
                
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                
                let dx = clientX - this.centerX;
                let dy = clientY - this.centerY;
                
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance > this.maxDistance) {
                    const angle = Math.atan2(dy, dx);
                    dx = Math.cos(angle) * this.maxDistance;
                    dy = Math.sin(angle) * this.maxDistance;
                }
                
                this.stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                
                // Normalize to -100..100
                const x = Math.round((dx / this.maxDistance) * 100);
                const y = Math.round((dy / this.maxDistance) * 100);
                
                if (this.onChange) {
                    this.onChange(x, -y); // Invert Y for intuitive control
                }
            }
            
            stopDrag() {
                if (!this.isDragging) return;
                this.isDragging = false;
                this.resetPosition();
            }
            
            resetPosition() {
                this.stick.style.transform = 'translate(-50%, -50%)';
                if (this.onChange) {
                    this.onChange(0, 0);
                }
            }
        }
        
        // === ROBOT CONTROL ===
        let movementJoystick;
        let rotationJoystick;
        let isConnected = false;
        let sendInterval;
        
        let currentSpeed = 0;
        let currentTurn = 0;
        let currentServo = 90;
        
        // Initialize joysticks
        window.onload = function() {
            movementJoystick = new Joystick('movement-joystick', 'movement-stick', 
                (x, y) => {
                    currentTurn = x;
                    currentSpeed = y;
                    
                    document.getElementById('speed-value').textContent = y;
                    document.getElementById('turn-value').textContent = x;
                    
                    if (isConnected) {
                        sendMoveCommand(y, x);
                    }
                }
            );
            
            rotationJoystick = new Joystick('rotation-joystick', 'rotation-stick',
                (x, y) => {
                    // Use X axis for servo control
                    currentServo = Math.round(90 + x * 0.9); // 0-180
                    currentServo = Math.max(0, Math.min(180, currentServo));
                    
                    document.getElementById('servo-value').textContent = currentServo;
                    
                    if (isConnected) {
                        setServo(currentServo);
                    }
                }
            );
            
            // Check robot status
            updateRobotStatus();
            setInterval(updateRobotStatus, 2000);
        };
        
        // Connect to robot
        async function connectRobot() {
            try {
                const response = await fetch('/api/robot/connect', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({port: '/dev/ttyUSB0'})
                });
                
                const data = await response.json();
                
                if (data.success) {
                    isConnected = true;
                    updateConnectionStatus(true);
                    alert('✅ Робот підключено!');
                } else {
                    alert('❌ Помилка: ' + (data.error || 'Не вдалося підключитись'));
                }
            } catch (error) {
                alert('❌ Помилка підключення: ' + error);
            }
        }
        
        // Send move command
        async function sendMoveCommand(speed, turn) {
            try {
                await fetch('/api/robot/move', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({speed: speed, turn: turn})
                });
                
                document.getElementById('info-speed').textContent = speed;
                document.getElementById('info-turn').textContent = turn;
            } catch (error) {
                console.error('Move error:', error);
            }
        }
        
        // Stop robot
        async function stopRobot() {
            try {
                await fetch('/api/robot/stop', {method: 'POST'});
                
                currentSpeed = 0;
                currentTurn = 0;
                
                document.getElementById('info-speed').textContent = '0';
                document.getElementById('info-turn').textContent = '0';
                document.getElementById('info-status').textContent = 'Зупинено';
            } catch (error) {
                console.error('Stop error:', error);
            }
        }
        
        // Weed pulse
        async function weedPulse() {
            try {
                await fetch('/api/robot/weed', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({action: 'pulse'})
                });
                
                document.getElementById('info-status').textContent = 'Прополювання!';
                setTimeout(() => {
                    document.getElementById('info-status').textContent = 'Готово';
                }, 1000);
            } catch (error) {
                console.error('Weed error:', error);
            }
        }
        
        // Set servo angle
        async function setServo(angle) {
            try {
                await fetch('/api/robot/weed', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({action: 'servo', angle: angle})
                });
                
                document.getElementById('info-servo').textContent = angle + '°';
            } catch (error) {
                console.error('Servo error:', error);
            }
        }
        
        // Go to detection
        async function goToDetection() {
            // Get latest detection from main page
            try {
                const response = await fetch('/api/detections');
                const data = await response.json();
                
                if (data.detections && data.detections.length > 0) {
                    const det = data.detections[0];
                    const [x, y] = det.center;
                    
                    await fetch('/api/robot/auto_weed', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({x: x, y: y})
                    });
                    
                    document.getElementById('info-status').textContent = `Їду до (${x}, ${y})`;
                } else {
                    alert('⚠️ Немає детекцій!');
                }
            } catch (error) {
                console.error('Auto weed error:', error);
            }
        }
        
        // Update robot status
        async function updateRobotStatus() {
            try {
                const response = await fetch('/api/robot/status');
                const data = await response.json();
                
                if (data.connected) {
                    isConnected = true;
                    updateConnectionStatus(true);
                } else {
                    isConnected = false;
                    updateConnectionStatus(false);
                }
            } catch (error) {
                isConnected = false;
                updateConnectionStatus(false);
            }
        }
        
        // Update connection status UI
        function updateConnectionStatus(connected) {
            const indicator = document.getElementById('status-indicator');
            const text = document.getElementById('status-text');
            
            if (connected) {
                indicator.className = 'status-indicator status-connected';
                text.textContent = '🟢 Підключено';
            } else {
                indicator.className = 'status-indicator status-disconnected';
                text.textContent = '🔴 Не підключено';
            }
        }
        
        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (!isConnected) return;
            
            switch(e.key) {
                case 'w': case 'ArrowUp':
                    sendMoveCommand(50, 0);
                    break;
                case 's': case 'ArrowDown':
                    sendMoveCommand(-50, 0);
                    break;
                case 'a': case 'ArrowLeft':
                    sendMoveCommand(0, -50);
                    break;
                case 'd': case 'ArrowRight':
                    sendMoveCommand(0, 50);
                    break;
                case ' ':
                    e.preventDefault();
                    stopRobot();
                    break;
                case 'p':
                    weedPulse();
                    break;
            }
        });
        
        document.addEventListener('keyup', (e) => {
            if (!isConnected) return;
            
            if (['w','s','a','d','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
                stopRobot();
            }
        });
    </script>
</body>
</html>
